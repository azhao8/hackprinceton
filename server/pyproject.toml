[project]
name = "miguel-server"
version = "0.1.0"
description = "Miguel.exe server: robot link, arbiter, vision, agent, skills and the web API"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "ultralytics>=8.4.213",
    "aiohttp>=3.14.5",
    "anthropic>=2.8.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]
local = [
    "en-core-web-sm ; sys_platform == 'darwin'",
    "misaki[en]==0.9.4 ; sys_platform == 'darwin'",
    "mlx-audio==0.6.5 ; sys_platform == 'darwin'",
    "parakeet-mlx==0.7.0 ; sys_platform == 'darwin'",
    "silero-vad==6.2.3 ; sys_platform == 'darwin'",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
