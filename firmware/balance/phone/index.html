<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot eye</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px -apple-system, system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  video, #ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 12px; white-space: pre-wrap;
         font: 13px ui-monospace, Menlo, monospace; background: linear-gradient(#000d, #0000); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px;
         background: linear-gradient(#0000, #000d); }
  button, select { font: inherit; padding: 10px 14px; border: 0; border-radius: 10px; background: #333; color: #fff; }
  #go { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; padding: 22px 40px;
        border-radius: 18px; background: #1a7f37; }
  #settings { display: none; }
  /* Server vision (Alex's design): the phone shows Miguel's face and streams its camera to the server. */
  /* The face fills the TOP HALF of the screen (Alex); face.js centers it in its canvas. The bottom half stays dark,
     with the status line at the very bottom. The camera keeps running underneath (it streams to the server). */
  #face { position: absolute; top: 0; left: 0; right: 0; width: 100%; height: 50%; background: #05070a; display: none; }   /* drawn by face.js */
  #wrap.faceon { background: #05070a; }
  #wrap.faceon video, #wrap.faceon #ov { opacity: 0; }
  #face.on { display: block; }
  /* Miguel's suit fills the BOTTOM HALF under the face: navy jacket, white shirt, red tie (Face.drawSuit). */
  #suit { position: absolute; top: 50%; left: 0; right: 0; width: 100%; height: 50%; display: none; }
  #suit.on { display: block; }
  #face.on ~ #hud { top: auto; bottom: 0; font-size: 11px; opacity: 0.6; background: none; }   /* decision 0053: every control is on the laptop's control page */
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <canvas id="face"></canvas>   <!-- before #hud, so "#face.on ~ #hud" applies and the hud draws on top -->
  <canvas id="suit"></canvas>
  <div id="hud">Tap Start once and allow the camera, then mount the phone.
Everything else is on the laptop's control page.</div>
  <button id="go">Start</button>
  <div id="settings">
    <button id="stop">Stop sending</button>
    <select id="mode"><option value="person">Follow a person</option><option value="yellow">Follow yellow</option></select>
    <button id="mute">Voice: on</button>
    <select id="cam"></select>
    <label>Stop distance <input id="dist" type="range" step="0.05"><b id="distL"></b></label>
    <label>Speed <input id="spd" type="range" min="0.1" max="0.45" step="0.05"><b id="spdL"></b></label>
  </div>
</div>
<script src="track.js"></script>
<script src="face.js"></script>   <!-- Miguel's face (global Face); the bench tool doesn't serve it, the page works without it -->
<script src="mic.js"></script>
<script>
// Miguel's eye and voice. Runs on the robot's iPhone: picks the 0.5x back camera, finds the target here on the phone
// (a person with MediaPipe, or something yellow), sends only speed and turn to the Mac, and talks through the phone's
// speaker. Served either by the main server (server/, python -m app: /auto goes to the arbiter) or by the bench
// tool phone_server.py (/auto goes to drive.py). Either way the robot moves only while Follow is ON on the Mac.
const $ = id => document.getElementById(id);
const v = $('v'), ov = $('ov'), octx = ov.getContext('2d'), hud = $('hud'), camSel = $('cam'), modeSel = $('mode');
const dist = $('dist'), spd = $('spd');
const pc = document.createElement('canvas'), pctx = pc.getContext('2d', { willReadFrequently: true });
const yellow = Track.makeTracker(), person = Track.makePersonTracker();
// distance: person = upper-body width to hold, yellow = patch size to hold (both "bigger = closer"); speed caps in m/s
const MODES = { person: { dmin: 0.25, dmax: 0.65, d: 0.45, s: 0.25 }, yellow: { dmin: 0.2, dmax: 0.6, d: 0.35, s: 0.4 } };
let stream = null, label = '', g = { kx: 1, ky: 1, uw: false }, sending = false, inflight = false, sendErr = '', robot = '';
let last = null, frames = 0, fps = 0, fpsT = performance.now(), detector = null, detectorState = '', lastTs = 0;

function post(path, obj) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
}
function log(obj) { post('/log', obj).catch(() => {}); }
function labels() { $('distL').textContent = (+dist.value).toFixed(2); $('spdL').textContent = (+spd.value).toFixed(2); }
dist.oninput = spd.oninput = labels;

// ---------- voice (the phone's speaker) ----------
// With the main server and CARTESIA_API_KEY set (/tel says tts: true), lines play as Cartesia speech from /tts;
// otherwise, or if a line fails or takes over 4 s, Safari's built-in voice says it.
// With /tel tts_stream: true (MIGUEL_TTS_STREAM=1 on the server), a line plays straight from the /tts URL, so it can
// start on the first chunk instead of after the whole download; if that ever fails, the page goes back to
// downloading each line whole (and logs it).
// The mouth follows the voice: Cartesia audio goes through a Web Audio analyser (its loudness opens the mouth);
// Safari's voice can't be measured, so each spoken word (and a steady beat, if words aren't reported) pulses it.
// Voice.current() is the line playing now ({text, id, n}); mic.js tells the server when it changes.
// Voice.ping() is the short "I'm listening" sound; Voice.stopAll() silences him and drops the queued lines.
const MOUTH_FLOOR = 0.02, MOUTH_GAIN = 6;                 // RMS (-1..1 samples) to mouth opening; a guess, tune on the phone
function mouthFromRms(rms) { return Math.max(0, Math.min(1, (rms - MOUTH_FLOOR) * MOUTH_GAIN)); }
const Voice = (() => {
  const ok = 'speechSynthesis' in window, saidAt = {}, audio = new Audio();   // ONE element, unlocked by the Start tap
  const SILENT = 'data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
  let ready = false, muted = false, voice = null, lastT = 0, cloud = false, queue = Promise.resolve(), pending = 0, endClip = null;
  let actx = null, analyser = null, buf = null, mouthId = 0, mouthRaf = 0, mouthTimer = 0, lastWord = 0;
  let cur = null, lineN = 0, gen = 0, streamOn = false, streamBroken = false;   // the line playing; queue generation
  function pick() {
    const vs = ok ? speechSynthesis.getVoices() : [];
    voice = vs.find(x => /^Fred\b/i.test(x.name)) || vs.find(x => /en-US/i.test(x.lang) && x.localService) ||
            vs.find(x => /^en/i.test(x.lang)) || null;
  }
  if (ok) { pick(); speechSynthesis.onvoiceschanged = pick; }
  // Web Audio: audio element -> analyser -> speaker. Built inside the Start tap (iOS only lets a tap start an AudioContext).
  // If any of it fails, the element stays unrouted and plays as before, and the mouth pulses instead.
  function wireAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS 17+: ignore the silent switch, like <audio> does
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('no Web Audio');
      if (!actx) actx = new AC();
      if (!analyser) {
        const an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0;
        an.connect(actx.destination);
        actx.createMediaElementSource(audio).connect(an);   // from here on the element is heard only through actx
        analyser = an; buf = new Uint8Array(an.fftSize);
      }
      actx.resume().catch(() => {});
    } catch (e) { log({ event: 'mouth sync: no Web Audio, pulsing instead', error: String(e) }); }
  }
  // the mouth: 'level' reads the analyser every frame, 'pulse' beats every 180 ms (word boundaries add pulses)
  function mouthStart(kind) {
    mouthStop(); const id = ++mouthId;
    if (kind === 'level') {
      let lvl = 0;
      const tick = () => {
        if (id !== mouthId) return;
        analyser.getByteTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; s += x * x; }
        lvl = Math.max(mouthFromRms(Math.sqrt(s / buf.length)), lvl * 0.8);   // opens at once, closes over ~5 frames
        Mouth.level(lvl);
        mouthRaf = requestAnimationFrame(tick);
      };
      tick();
    } else {
      mouthTimer = setInterval(() => {
        const talking = kind === 'speech' ? ok && speechSynthesis.speaking : !audio.paused;
        if (talking && Date.now() - lastWord > 300) Mouth.pulse(0.5);       // steady beat when no word events come
      }, 180);
    }
    return id;
  }
  function mouthStop(id) {
    if (id !== undefined && id !== mouthId) return;          // an older line finishing late: not ours to close (no id: stop all)
    mouthId++; cancelAnimationFrame(mouthRaf); clearInterval(mouthTimer); Mouth.level(0);
  }
  function silence() { if (ok) speechSynthesis.cancel(); audio.pause(); if (endClip) endClip(); mouthStop(); cur = null; }
  function speak(text, sid) {                             // Safari's voice; resolves when it's done
    if (!ok) return Promise.resolve();
    const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice;
    const line = { text, id: sid, n: ++lineN };
    return new Promise(resolve => {
      let id;
      const done = () => { if (id) mouthStop(id); if (cur === line) cur = null; resolve(); };
      u.onstart = () => { id = mouthStart('speech'); cur = line; };
      u.onboundary = e => { if (!e.name || e.name === 'word') { lastWord = Date.now(); Mouth.pulse(0.8); } };
      u.onend = u.onerror = done; setTimeout(done, 15000); speechSynthesis.speak(u);
    });
  }
  // Resolves when the clip ends (or is muted); rejects if it can't play, or (startMs) hasn't started by then.
  async function play(url, line, startMs) {
    if (analyser && actx.state !== 'running') {             // routed through Web Audio: a stopped context would play silence
      await Promise.race([actx.resume().catch(() => {}), new Promise(r => setTimeout(r, 800))]);
      if (actx.state !== 'running') throw new Error('audio context ' + actx.state);   // -> Safari's voice says it
    }
    return new Promise((done, fail) => {
      let id, timer = 0;
      const off = () => { clearTimeout(timer); audio.onended = audio.onerror = null; endClip = null; if (id) mouthStop(id); if (cur === line) cur = null; };
      endClip = () => { off(); done(); };
      audio.onended = endClip; audio.onerror = () => { off(); fail(new Error('audio error')); };
      if (startMs) timer = setTimeout(() => { off(); audio.pause(); fail(new Error('no sound after ' + startMs + ' ms')); }, startMs);
      audio.src = url;
      audio.play().then(() => {
        clearTimeout(timer);
        if (endClip) { id = mouthStart(analyser ? 'level' : 'pulse'); cur = line; }   // playing: mic.js tells the server
      }, e => { off(); fail(e); });
    });
  }
  async function cartesia(text, sid) {
    if (muted) return;
    const src = '/tts?text=' + encodeURIComponent(text), line = { text, id: sid, n: ++lineN };
    if (streamOn && !streamBroken) {                        // play while it downloads (MIGUEL_TTS_STREAM=1)
      try { await play(src, line, 4000); return; } catch (e) {
        if (muted) return;
        streamBroken = true;                                // don't try again this session: download lines whole
        log({ event: 'streamed voice failed; downloading each line whole from now on', text, error: String(e) });
      }
    }
    let url = '';
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 4000);
      try {
        const res = await fetch(src, { signal: ctl.signal, cache: 'no-store' });
        if (!res.ok) throw new Error('/tts answered ' + res.status);
        url = URL.createObjectURL(await res.blob());
      } finally { clearTimeout(timer); }
      if (!muted) await play(url, line);
    } catch (e) {
      log({ event: 'cartesia voice failed, using Safari voice', text, error: String(e) });
      if (!muted) await speak(text, sid);
    } finally { if (url) URL.revokeObjectURL(url); }
  }
  function out(text, sid) {                               // one line at a time, in order, on either path
    if (!cloud) { speak(text, sid); return; }
    const g = gen;
    pending++;
    queue = queue.then(() => g === gen ? cartesia(text, sid) : null).finally(() => { pending--; });
  }
  function ping() {                                       // "I'm listening": two quick soft notes, ~0.2 s
    if (muted || !actx || actx.state !== 'running') return;
    try {
      const t = actx.currentTime + 0.01;
      [[880, 0], [1320, 0.09]].forEach(([f, dt]) => {
        const o = actx.createOscillator(), gn = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        gn.gain.setValueAtTime(0.0001, t + dt);
        gn.gain.exponentialRampToValueAtTime(0.3, t + dt + 0.012);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.12);
        o.connect(gn); gn.connect(actx.destination);      // straight to the speaker: the mouth stays still
        o.start(t + dt); o.stop(t + dt + 0.13);
      });
    } catch (e) {}
  }
  const busy = () => pending > 0 || (ok && speechSynthesis.speaking);
  return {
    busy,                                                                                // read-only: is Miguel talking? (mic.js)
    current() { return cur; },                                                           // the line playing now (mic.js)
    ping,
    stopAll() { gen++; silence(); },                                                     // tap-to-talk: stop talking now
    server(on, stream) { cloud = on; streamOn = !!stream; },                             // from /tel: /tts set up? streamed?
    unlock(text) {                                                                       // inside a tap (iOS needs one)
      ready = true;
      audio.src = SILENT; audio.play().catch(() => {});                                  // lets this element play later
      wireAudio();                                                                       // and the mouth's analyser
      if (ok) { pick(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); }      // and Safari's voice
      if (!muted) out(text); lastT = Date.now();
    },
    toggle() {
      muted = !muted;
      if (muted) silence();
      return muted;
    },
    setMuted(m) {
      muted = !!m;
      if (muted) silence();
    },
    now(text, sid) { if (ready && !muted) { out(text, sid); lastT = Date.now(); } },    // from the server: say it
    event(key, lines, cooldown = 10) {                                                   // automatic lines, rate-limited
      if (!ready || muted) return;
      const t = Date.now();
      if (busy() || t - lastT < 2500) return;
      if (saidAt[key] && t - saidAt[key] < cooldown * 1000) return;
      out(lines[Math.floor(Math.random() * lines.length)]); lastT = t; saidAt[key] = t;
    }
  };
})();
$('mute').onclick = () => { $('mute').textContent = 'Voice: ' + (Voice.toggle() ? 'off' : 'on'); };

let everSeen = false, lostSpoken = true, capSince = 0;
// The server makes these lines (and Start's "Hi, I'm Miguel.") ahead of time: keep PHONE_LINES in server/app/api in sync.
function talk(r, what) {
  const t = performance.now() / 1000;
  if (r.target) {
    if (r.how === 'acquired') Voice.event('hello', what === 'person'
      ? ["Hi! I'll follow you.", 'Found you!', 'Hello there! Lead the way.'] : ['Ooh, something yellow!', 'I see yellow!']);
    everSeen = true; lostSpoken = false;
    if (r.tooClose) Voice.event('close', ['Whoa, personal space!', "That's a little close."], 12);
    if (r.v >= +spd.value * 0.9) { if (!capSince) capSince = t; else if (t - capSince > 3) Voice.event('wait', ['Wait for me!', 'Not so fast!'], 15); }
    else capSince = 0;
  } else {
    capSince = 0;
    if (everSeen && !lostSpoken && r.lostFor > 2.5) {
      lostSpoken = true;
      Voice.event('lost', what === 'person' ? ['Where did you go?', 'Hello? I lost you.'] : ['Where did my yellow thing go?']);
    }
  }
}

// ---------- person detector (MediaPipe, loaded from the CDN on first use) ----------
async function loadDetector() {
  if (detector || detectorState === 'loading') return;
  detectorState = 'loading';
  try {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await import(base + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(base + '/wasm');
    const opts = delegate => ({
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite', delegate },
      scoreThreshold: 0.35, maxResults: 5, categoryAllowlist: ['person'], runningMode: 'VIDEO' });
    try { detector = await vision.ObjectDetector.createFromOptions(files, opts('GPU')); }
    catch (e) { detector = await vision.ObjectDetector.createFromOptions(files, opts('CPU')); }
    detectorState = 'ready';
    log({ event: 'person detector ready' });
  } catch (e) {
    detectorState = 'failed: ' + e.message;
    log({ event: 'person detector failed', error: String(e) });
  }
}

function setMode() {
  const m = MODES[modeSel.value];
  dist.min = m.dmin; dist.max = m.dmax; dist.value = m.d; spd.value = m.s; labels();
  if (modeSel.value === 'person') loadDetector();
}
modeSel.onchange = setMode;
setMode();

// ---------- camera ----------
async function openCam(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const video = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (deviceId) video.deviceId = { exact: deviceId }; else video.facingMode = { ideal: 'environment' };
  stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  v.srcObject = stream;
  await v.play();
  label = stream.getVideoTracks()[0].label || '';
}

async function listCams() {
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  camSel.innerHTML = '';
  for (const c of cams) {
    const o = document.createElement('option');
    o.value = c.deviceId; o.textContent = c.label || 'camera'; o.selected = c.label === label;
    camSel.appendChild(o);
  }
  return cams;
}

async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sending) keepAwake(); });

// Which camera: "back" (default) or "front", set on the control page. Ultra-wide when there is one.
let wantCamera = 'back';
function pickCamera(cams, side) {
  const re = side === 'front' ? /front/i : /back/i;
  return cams.find(c => re.test(c.label) && /ultra ?wide/i.test(c.label)) || cams.find(c => re.test(c.label));
}
async function switchCamera(side) {
  wantCamera = side;
  if (!stream) return;                                      // start() will pick it
  try {
    const want = pickCamera(await listCams(), side);
    if (want && want.label !== label) { await openCam(want.deviceId); await listCams(); log({ event: 'camera', using: label }); }
  } catch (e) { log({ event: 'camera error', error: String(e) }); }
}

async function start() {
  try {
    await openCam(null);                                   // asks for permission; then the camera names are visible
    const cams = await listCams();
    const want = pickCamera(cams, wantCamera);
    if (want && want.label !== label) { await openCam(want.deviceId); await listCams(); }
    sending = true;
    keepAwake();
    log({ event: 'camera', using: label, frame: v.videoWidth + 'x' + v.videoHeight, cameras: cams.map(c => c.label) });
  } catch (e) {
    hud.textContent = 'Camera error: ' + e.name + ': ' + e.message;
    log({ event: 'camera error', error: e.name + ': ' + e.message });
  }
}

$('go').onclick = () => {                                                // the tap also unlocks the speaker and the mic
  Voice.unlock("Hi, I'm Miguel."); const cam = start(); $('go').style.display = 'none';
  if (window.Mic) Mic.start(cam);                                         // asks for the mic after the camera (mic.js)
};

// Follow settings come from the laptop's control page, through the server's /tel (decision 0053)
let appliedSettings = '';
function applySettings(st) {
  if (!st || !MODES[st.mode]) return;
  const key = JSON.stringify(st);
  if (key === appliedSettings) return;
  appliedSettings = key;
  if (modeSel.value !== st.mode) { modeSel.value = st.mode; setMode(); }
  dist.value = st.distance; spd.value = st.speed; labels();
  Voice.setMuted(!st.voice);
  if (st.camera && st.camera !== wantCamera) switchCamera(st.camera);
}
$('stop').onclick = () => { sending = false; post('/auto', { v: 0, w: 0, found: false, cx: 0.5, h: 0 }).catch(() => {}); };
camSel.onchange = async () => {
  try { await openCam(camSel.value); await listCams(); log({ event: 'camera', using: label }); }
  catch (e) { hud.textContent = 'Camera error: ' + e.message; }
};

function draw(r, W, H) {
  const ow = Math.round(W / 2), oh = Math.round(H / 2);
  if (ov.width !== ow || ov.height !== oh) { ov.width = ow; ov.height = oh; }
  octx.clearRect(0, 0, ow, oh);
  octx.strokeStyle = 'rgba(255,255,255,0.6)'; octx.lineWidth = 2;
  octx.beginPath(); octx.moveTo(ow / 2, 0); octx.lineTo(ow / 2, oh); octx.stroke();
  for (const b of r.all) {
    const tgt = r.target === b;
    octx.strokeStyle = tgt ? '#22c55e' : '#f59e0b'; octx.lineWidth = tgt ? 6 : 3;
    octx.strokeRect(b.box.x * ow, b.box.y * oh, b.box.w * ow, b.box.h * oh);
  }
}

// ~15 times a second: find the target, decide speed and turn, send them, talk
setInterval(() => {
  if (!stream || !v.videoWidth || serverVision) return;   // server vision: the server tracks, not the phone
  const W = v.videoWidth, H = v.videoHeight, what = modeSel.value, now = performance.now() / 1000;
  g = Track.geom(label, W, H);
  let r;
  if (what === 'person') {
    if (!detector) return;                                  // still loading: send nothing, the robot holds
    let ts = performance.now(); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
    const res = detector.detectForVideo(v, ts);
    const boxes = (res.detections || []).map(d => ({ x: d.boundingBox.originX / W, y: d.boundingBox.originY / H,
                                                     w: d.boundingBox.width / W, h: d.boundingBox.height / H }));
    r = person.step(boxes, now, { kx: g.kx, targetW: +dist.value, vmax: +spd.value });
  } else {
    const L = 240, gw = W >= H ? L : Math.round(W * L / H), gh = W >= H ? Math.round(H * L / W) : L;
    if (pc.width !== gw || pc.height !== gh) { pc.width = gw; pc.height = gh; }
    pctx.drawImage(v, 0, 0, gw, gh);
    r = yellow.step(pctx.getImageData(0, 0, gw, gh).data, gw, gh, now,
                    { kx: g.kx, ky: g.ky, targetY: +dist.value, vmax: +spd.value });
  }
  last = r; frames++;
  talk(r, what);
  if (sending && !inflight) {
    inflight = true;
    post('/auto', { v: r.v, w: r.w, found: !!r.target, cx: r.target ? r.target.cx : 0.5, h: r.target ? r.target.size : 0 })
      .then(res => { sendErr = res.ok ? '' : 'the Mac is not passing commands on (server or drive.py down)'; })
      .catch(() => { sendErr = 'Mac not reachable'; })
      .finally(() => { inflight = false; });
  }
  draw(r, W, H);
}, 66);

// ---------- server vision: stream the camera to the server (POST /frame), show the face ----------
let serverVision = false, frameInflight = false, framesSent = 0, sentFps = 0, sentT = performance.now();
const fc = document.createElement('canvas'), fctx = fc.getContext('2d');
function setServerVision(on) {
  if (on === serverVision) return;
  serverVision = on;
  $('face').classList.toggle('on', on);
  $('suit').classList.toggle('on', on);
  $('wrap').classList.toggle('faceon', on);
  if (on) paintSuit();
  if (on && !face && typeof Face !== 'undefined') { face = Face.create($('face')); face.setListening(Listen.on); }
  if (face) { if (on) face.start(); else face.stop(); }
  log({ event: 'vision mode', mode: on ? 'server' : 'phone' });
}

function paintSuit() { if (serverVision && typeof Face !== 'undefined' && Face.paintSuit) Face.paintSuit($('suit')); }
window.addEventListener('resize', paintSuit);

// ---------- Miguel's face (face.js): eyes on the locked person, mood from the robot and the tracker ----------
let face = null, faceEvent = null, eventMood = null, eventUntil = 0, gaveUp = false, shownMood = '', gazing = true;
const Mouth = { level(x) { if (face) face.setMouth(x); }, pulse(s) { if (face) face.pulseMouth(s); } };
const MIRROR = new URLSearchParams(location.search).get('mirror') === '1';   // ?mirror=1 flips the eyes left/right
const clamp1 = x => Math.max(-1, Math.min(1, x));
// Where the eyes look, from the viewer's side of the screen (x > 0: viewer's right, y > 0: down), given the target's
// spot in the streamed camera frame (normalized, NOT mirrored). The front camera faces the same way as the screen, so
// the frame's left (small cx) is the viewer's right; the back camera faces away, so it isn't flipped. Not yet checked
// on the real iPhone: if the eyes look away from the person, open the page with ?mirror=1.
function gaze(t, side, mirror) {
  const x = (side === 'front' ? 0.5 - t.cx : t.cx - 0.5) * 2;
  return { x: clamp1(mirror ? -x : x), y: clamp1((t.cy - 0.45) * 2) };
}
function cameraSide() { return /front/i.test(label) ? 'front' : /back/i.test(label) ? 'back' : wantCamera; }
const EVENT_MOODS = { found: ['happy', 2], too_close: ['surprised', 1.5], lost: ['worried', 2], gave_up: ['worried', 2.5] };
function faceMood(d, f, now) {
  if (d.estop) return 'alarm';
  if (Listen.on) return 'listening';                           // the ring is on: attentive eyes too
  if (now < eventUntil) return eventMood;
  if ((d.tel || {}).state === 'idle' && !d.follow) return 'sleepy';               // parked
  if (f && f.status === 'lost' && !gaveUp) return 'worried';
  return 'idle';
}
function updateFace(d) {                                     // every /tel answer
  const f = d.face || null, now = performance.now() / 1000;
  if (f && f.event && f.event.id !== faceEvent) {            // each event once
    faceEvent = f.event.id;
    const em = EVENT_MOODS[f.event.kind];
    if (em) { eventMood = em[0]; eventUntil = now + em[1]; }
    if (f.event.kind === 'gave_up') gaveUp = true;           // worried, then back to idle while still lost
  }
  if (!f || f.status !== 'lost') gaveUp = false;
  if (!face) return;
  const m = faceMood(d, f, now);
  if (m !== shownMood) { shownMood = m; face.setMood(m); }
  if (f && f.target) { const p = gaze(f.target, cameraSide(), MIRROR); face.lookAt(p.x, p.y); gazing = true; }
  else if (gazing) { face.lookAt(null); gazing = false; }   // nobody locked: let the eyes wander
}
setInterval(() => {                                         // ~12 frames a second, one upload at a time
  if (!serverVision || !stream || !v.videoWidth || frameInflight) return;
  const W = v.videoWidth, H = v.videoHeight, k = 640 / Math.max(W, H);
  const fw = Math.round(W * k), fh = Math.round(H * k);
  if (fc.width !== fw || fc.height !== fh) { fc.width = fw; fc.height = fh; }
  fctx.drawImage(v, 0, 0, fw, fh);
  frameInflight = true;
  fc.toBlob(blob => {
    if (!blob) { frameInflight = false; return; }
    fetch('/frame', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
      .then(res => { sendErr = res.ok ? '' : 'the server refused a camera frame (' + res.status + ')'; if (res.ok) framesSent++; })
      .catch(() => { sendErr = 'Mac not reachable'; })
      .finally(() => { frameInflight = false; });
  }, 'image/jpeg', 0.7);
}, 80);

// ---------- listening (the server's turn-taking, server/app/speech/mic.py) ----------
// While Miguel listens for a command (after "Miguel", a question of his, a wait for an answer, or a tap on the face)
// the face shows a glowing ring and he pings once when it starts. The state comes over the mic socket the moment it
// changes ({type: 'listen', on, why}); /tel's `listening` covers the times that socket is down.
const Listen = (() => {
  let on = false, why = null, heard = 0;                      // heard: when the server last told us
  function set(next, reason, fromServer) {
    next = !!next;
    if (fromServer) heard = Date.now();
    if (next && !on) Voice.ping();                            // listening starts: ping (once, whatever turned it on)
    on = next; why = next ? (reason || why) : null;
    if (face) face.setListening(on);
  }
  return { set, get on() { return on; }, get why() { return why; }, get heard() { return heard; } };
})();

// Tap-to-talk: tapping Miguel (face or suit) stops him talking and listens for one sentence, no "Miguel" needed.
function tapToTalk() {
  if (!window.Mic || !Mic.running) return;
  if (Voice.busy()) Voice.stopAll();
  if (!Mic.send({ type: 'listen' })) { log({ event: 'tap-to-talk: the mic is not connected' }); return; }
  const t0 = Date.now();
  Listen.set(true, 'tap');                                    // at once; the server confirms, and turns it off after
  setTimeout(() => { if (Listen.on && Listen.heard < t0) Listen.set(false); }, 9000);   // never confirmed: drop it
}
$('face').addEventListener('click', tapToTalk);
$('suit').addEventListener('click', tapToTalk);

// lines from the server (the agent, the control page): pushed over the mic socket at once, and polled as a backup
let sayAfter = -1;
function hearSay(id, text) {
  if (typeof id !== 'number' || id <= sayAfter) return;      // each line once, whichever path brings it first
  sayAfter = id; Voice.now(text, id);
}
window.onMicMessage = msg => {
  if (msg.type === 'listen') Listen.set(msg.on, msg.why, true);
  else if (msg.type === 'say') hearSay(msg.id, String(msg.text || ''));
};
setInterval(async () => {
  try {
    const d = await (await fetch('/say?after=' + sayAfter)).json();
    if (sayAfter < 0) { sayAfter = d.last; return; }        // don't replay old lines when the page opens
    for (const m of d.msgs) hearSay(m.id, m.text);
  } catch (e) {}
}, 600);

(async function pollTel() {                                // robot state, from drive.py through the Mac
  try {
    const d = await (await fetch('/tel')).json(), t = d.tel || {};
    setServerVision(!!(d.vision && d.vision.mode === 'server'));
    applySettings(d.settings);                              // first: the camera side the gaze uses
    updateFace(d);
    if (!d.settings) $('settings').style.display = 'flex';    // bench tool phone_server.py: no control page, show them here
    Voice.server(!!d.tts, !!d.tts_stream);                  // phone_server.py has no tts: Safari's voice
    if (!(window.Mic && Mic.connected) && 'listening' in d) Listen.set(d.listening, null);   // mic socket down: /tel
    robot = 'Robot: ' + (t.state || '?') + (typeof t.pitch === 'number' ? '  pitch ' + t.pitch.toFixed(1) : '') +
            '   Follow ' + (d.follow ? 'ON' : 'off (turn it on: control page, or F on the drive page)');
  } catch (e) { robot = 'Robot: no answer from the Mac'; }
  setTimeout(pollTel, serverVision ? 125 : 1000);           // ~8 Hz while the face is on: fresh targets for the eyes
})();

setInterval(() => {
  const now = performance.now(); fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
  sentFps = framesSent * 1000 / (now - sentT); framesSent = 0; sentT = now;
  if (serverVision) {
    hud.textContent = [label ? 'Camera → server: ' + sentFps.toFixed(0) + ' fps  (' + label + ')' : 'Tap Start and allow the camera.',
                       robot, sendErr].filter(Boolean).join('\n');
    return;
  }
  const r = last, what = modeSel.value;
  hud.textContent = [
    label ? 'Camera: ' + label + (g.uw ? '  (0.5x)' : '') : 'Tap Start and allow the camera.',
    what === 'person' && detectorState !== 'ready' ? 'Person detector: ' + (detectorState || 'not loaded') : '',
    !r ? '' : r.target ? (what === 'person' ? 'Person' : 'Yellow') + ': offset ' + (r.target.cx - 0.5).toFixed(2) +
                         '  size ' + r.target.size.toFixed(2) + '  [' + r.how + ']'
            : r.all.length ? 'No target (' + r.all.length + ' other(s) ignored)' : 'Nothing in view',
    !r ? '' : 'Command: speed ' + r.v.toFixed(2) + ' m/s  turn ' + r.w.toFixed(2) + ' rad/s' + (sending ? '' : '  (not sending)'),
    robot, sendErr, stream ? fps.toFixed(0) + ' fps' : ''
  ].filter(Boolean).join('\n');
}, 500);
</script>
</body>
</html>
