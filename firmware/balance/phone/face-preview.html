<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miguel face preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #FAEEDA; font: 13px -apple-system, system-ui, sans-serif; color: #2C2C2A; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #e9dcc6; }
  /* like the phone: the face fills the top half, Miguel's suit the bottom half */
  #screen { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
  #face, #suit { display: block; width: 100%; flex: 1 1 50%; min-height: 0; touch-action: none; }
  body.phone #screen { width: auto; height: min(100%, 844px); aspect-ratio: 390 / 844; border-radius: 28px;
                       box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px;
         background: #fff8ee; border-top: 1px solid #e6d6bb; }
  #bar .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { font: inherit; padding: 4px 9px; border: 1px solid #d9c4a3; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
  button.on { background: #2C2C2A; color: #FAEEDA; border-color: #2C2C2A; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  input[type=range] { width: 110px; }
  #hint { color: #8a7a62; }
</style>
</head>
<body>
<div id="stage"><div id="screen"><canvas id="face"></canvas><canvas id="suit"></canvas></div></div>
<div id="bar">
  <div class="group" id="moods"></div>
  <div class="group">
    <label><input type="checkbox" id="follow" checked> gaze follows the mouse</label>
    <label><input type="checkbox" id="phone"> phone size</label>
  </div>
  <div class="group">
    <label>mouth <input type="range" id="mouth" min="0" max="1" step="0.01" value="0"></label>
    <button id="talk">talk</button>
    <button id="pulses">word pulses</button>
  </div>
  <span id="hint">keys 1-7: moods</span>
</div>
<script src="face.js"></script>
<script>
(function () {
  var canvas = document.getElementById('face');
  var face = Face.create(canvas);
  face.start();
  var suit = document.getElementById('suit');
  function paintSuit() { Face.paintSuit(suit); }
  paintSuit();
  window.addEventListener('resize', paintSuit);

  // moods
  var moodsEl = document.getElementById('moods'), buttons = {};
  function setMood(m) {
    face.setMood(m);
    Object.keys(buttons).forEach(function (k) { buttons[k].className = k === m ? 'on' : ''; });
  }
  Face.MOODS.forEach(function (m, i) {
    var b = document.createElement('button');
    b.textContent = (i + 1) + ' ' + m;
    b.onclick = function () { setMood(m); };
    moodsEl.appendChild(b); buttons[m] = b;
  });
  setMood(location.hash.slice(1) || 'idle');   // face-preview.html#happy opens in that mood
  document.addEventListener('keydown', function (e) {
    var i = parseInt(e.key, 10) - 1;
    if (i >= 0 && i < Face.MOODS.length) setMood(Face.MOODS[i]);
  });

  // gaze: viewer's point of view, x > 0 = right, y > 0 = down
  var follow = document.getElementById('follow');
  function onMove(e) {
    if (!follow.checked) return;
    var r = canvas.getBoundingClientRect();
    face.lookAt(((e.clientX - r.left) / r.width) * 2 - 1, ((e.clientY - r.top) / r.height) * 2 - 1);
  }
  window.addEventListener('pointermove', onMove);
  document.addEventListener('pointerleave', function () { face.lookAt(null); });
  follow.onchange = function () { if (!follow.checked) face.lookAt(null); };

  document.getElementById('phone').onchange = function (e) { document.body.classList.toggle('phone', e.target.checked); requestAnimationFrame(paintSuit); };

  // mouth slider (the talk simulation drives it too)
  var slider = document.getElementById('mouth');
  slider.oninput = function () { stopTalk(); face.setMouth(+slider.value); };

  // talk: a random syllable envelope for 3 s, like audio loudness
  var talkTimer = 0;
  function stopTalk() { if (talkTimer) { clearInterval(talkTimer); talkTimer = 0; face.setMouth(+slider.value); } }
  document.getElementById('talk').onclick = function () {
    stopTalk();
    var syl = [], t = 0;
    while (t < 3) {
      var dur = 0.09 + Math.random() * 0.13;
      syl.push({ start: t, dur: dur, peak: 0.35 + Math.random() * 0.65 });
      t += dur + (Math.random() < 0.2 ? 0.15 + Math.random() * 0.2 : 0.02 + Math.random() * 0.08);   // pauses between words
    }
    var t0 = performance.now();
    talkTimer = setInterval(function () {
      var now = (performance.now() - t0) / 1000, level = 0;
      if (now > 3.2) { stopTalk(); return; }
      syl.forEach(function (s) {
        var p = (now - s.start) / s.dur;
        if (p > 0 && p < 1) level = Math.max(level, s.peak * Math.sin(Math.PI * p));
      });
      face.setMouth(level);
    }, 30);
  };

  // word pulses: what Safari's speech word-boundary events will look like
  document.getElementById('pulses').onclick = function () {
    var t = 0;
    while (t < 3) {
      (function (strength) { setTimeout(function () { face.pulseMouth(strength); }, t * 1000); })(0.6 + Math.random() * 0.4);
      t += 0.22 + Math.random() * 0.25;
    }
  };
})();
</script>
</body>
</html>
