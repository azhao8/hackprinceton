<svg xmlns="http://www.w3.org/2000/svg" width="680" height="606" viewBox="0 0 680 606" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Miguel.exe system architecture</title>
<desc>The iPhone phone page and the laptop dashboard both talk to one Python server over WebSockets. Inside the server, the API feeds vision, vision feeds the agent and skills, skills and the dashboard's e-stop and joystick go through the arbiter, and the link sends one speed and turn to the robot ESP32 or the mock robot.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.tt{font-size:14px;font-weight:500;fill:#085041}
.ts{font-size:12px;fill:#0F6E56}
.tc{font-size:14px;font-weight:500;fill:#712B13}
.sc{font-size:12px;fill:#993C1D}
.l{stroke:#5F5E5A;stroke-width:1.2;fill:none}
</style>
</defs>
<rect width="680" height="606" fill="#FFFFFF"/>
<rect x="60" y="30" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="t" x="180" y="53" text-anchor="middle">iPhone: phone page</text>
<text class="s" x="180" y="73" text-anchor="middle">Face, camera, mic, sensors</text>
<rect x="380" y="30" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="t" x="500" y="53" text-anchor="middle">Laptop browser: dashboard</text>
<text class="s" x="500" y="73" text-anchor="middle">Telemetry, e-stop, joystick</text>
<rect x="40" y="130" width="600" height="300" rx="20" fill="#F7F6F2" stroke="#888780" stroke-width="0.5"/>
<text class="t" x="620" y="157" text-anchor="end">Python server on the laptop</text>
<line class="l" x1="150" y1="88" x2="150" y2="178" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="l" d="M500 88 L500 110 L200 110 L200 178" marker-start="url(#a)" marker-end="url(#a)"/>
<g>
<rect x="70" y="180" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="150" y="203" text-anchor="middle">API (Nick)</text>
<text class="ts" x="150" y="223" text-anchor="middle">WebSocket in and out</text>
<rect x="260" y="180" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="340" y="203" text-anchor="middle">Vision (Grant)</text>
<text class="ts" x="340" y="223" text-anchor="middle">OpenCV, MediaPipe</text>
<rect x="450" y="180" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="530" y="203" text-anchor="middle">Agent (Grant)</text>
<text class="ts" x="530" y="223" text-anchor="middle">Claude picks skills</text>
<rect x="450" y="290" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="530" y="313" text-anchor="middle">Skills (Grant)</text>
<text class="ts" x="530" y="333" text-anchor="middle">Follow, stop, turn</text>
<rect x="260" y="290" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="340" y="313" text-anchor="middle">Arbiter (Alex)</text>
<text class="ts" x="340" y="333" text-anchor="middle">Picks one command</text>
<rect x="70" y="290" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tt" x="150" y="313" text-anchor="middle">Link (Alex)</text>
<text class="ts" x="150" y="333" text-anchor="middle">UDP JSON, 20 Hz</text>
</g>
<line class="l" x1="232" y1="208" x2="258" y2="208" marker-end="url(#a)"/>
<line class="l" x1="422" y1="208" x2="448" y2="208" marker-end="url(#a)"/>
<line class="l" x1="530" y1="238" x2="530" y2="288" marker-end="url(#a)"/>
<path class="l" d="M410 238 L410 268 L470 268 L470 288" marker-end="url(#a)"/>
<path class="l" d="M215 238 L215 262 L290 262 L290 288" marker-end="url(#a)"/>
<line class="l" x1="448" y1="318" x2="422" y2="318" marker-end="url(#a)"/>
<line class="l" x1="258" y1="318" x2="232" y2="318" marker-end="url(#a)"/>
<line class="l" x1="150" y1="348" x2="150" y2="468" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="l" d="M200 348 L200 448 L505 448 L505 468" stroke-dasharray="4 4" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="40" y="470" width="290" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="tc" x="185" y="493" text-anchor="middle">Robot ESP32 (John's firmware)</text>
<text class="sc" x="185" y="513" text-anchor="middle">Balance, drive, motors, safety</text>
<rect x="370" y="470" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="t" x="505" y="493" text-anchor="middle">Mock robot (desk testing)</text>
<text class="s" x="505" y="513" text-anchor="middle">Same messages, no hardware</text>
<text class="s" x="40" y="560">Phone and dashboard: WebSocket to the server's API. Server to robot: JSON over UDP on our own hotspot.</text>
<text class="s" x="40" y="580">The robot balances and enforces its own safety; the server only sends speed and turn.</text>
</svg>
